<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 | Sandwhich?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #b8d98b;
    --primary-active: #d4e8ad;
    --primary-pale: #eef6dc;
    --on-primary: #1f1510;
    --ink: #1f1510;
    --body: #454745;
    --mute: #868685;
    --canvas: #ffffff;
    --bg: #fcf9f2;
    --card-bg: #f0ebe1;
    --hover: #d4e8ad;
    --banner: #f7efd2;
    --positive-deep: #054d28;
    --negative: #d03238;
    --r-md: 12px;
    --r-xl: 24px;
    --r-pill: 9999px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Inter, 'Noto Sans KR', system-ui, -apple-system, sans-serif;
    font-feature-settings: "calt";
    font-size: 16px; line-height: 24px;
    background: var(--bg); color: var(--ink);
  }
  .view { padding: 32px; max-width: 520px; margin: 0 auto; }
  h1 { font-size: 40px; line-height: 44px; font-weight: 900; }
  .sub { color: var(--body); margin-top: 4px; margin-bottom: 24px; }

  .card { background: var(--card-bg); border-radius: var(--r-xl); padding: 24px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .tab {
    flex: 1; padding: 10px 16px; border: none; border-radius: var(--r-pill);
    background: var(--canvas); color: var(--ink);
    font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; transition: background .12s;
  }
  .tab:hover { background: var(--primary-active); }
  .tab.on { background: var(--primary); }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .field .hint { display: block; font-size: 12px; line-height: 16px; color: var(--mute); margin-top: 4px; }
  .pw { display: flex; gap: 8px; }
  input[type=text], input[type=password] {
    width: 100%; padding: 12px 16px; font: inherit; color: var(--ink);
    background: var(--canvas); border: none; border-radius: var(--r-md);
  }
  input:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
  .eye { flex: 0 0 auto; padding: 0 14px; border: none; border-radius: var(--r-md); background: var(--canvas); font: inherit; font-size: 13px; font-weight: 600; color: var(--body); cursor: pointer; }
  .eye:hover { background: var(--banner); }

  .btn {
    width: 100%; padding: 12px 24px; border: none; border-radius: var(--r-xl);
    background: var(--primary); color: var(--on-primary);
    font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; transition: background .15s;
  }
  .btn:hover { background: var(--hover); }
  .btn.secondary { background: var(--canvas); margin-top: 8px; }
  .btn.secondary:hover { background: var(--banner); }
  .btn:disabled { opacity: .55; cursor: default; }
  .msg { margin-top: 12px; font-size: 14px; min-height: 20px; color: var(--negative); }
  .msg.ok { color: var(--positive-deep); }

  .privacy { margin-top: 16px; background: var(--banner); border-radius: var(--r-xl); padding: 16px 20px; font-size: 14px; line-height: 20px; }
  .privacy b { font-weight: 600; }
  .privacy ul { margin: 6px 0 0 18px; color: var(--body); }

  .me { text-align: center; }
  .me .big { font-size: 56px; line-height: 64px; display: block; margin-bottom: 8px; filter: sepia(.3) saturate(1.1); }
  .me h2 { font-size: 24px; line-height: 31px; font-weight: 600; letter-spacing: -0.48px; margin-bottom: 4px; }
  .me p { color: var(--body); font-size: 14px; margin-bottom: 16px; }

  @media (max-width: 767px) {
    .view { padding: 16px; }
    h1 { font-size: 32px; line-height: 36px; }
  }
</style>
</head>
<body>
<div class="view">
  <h1>로그인</h1>
  <p class="sub">내가 저장한 조합을 어디서든 다시 보려면 로그인하세요.</p>

  <!-- 로그인 전 -->
  <div class="card" id="formCard">
    <div class="tabs" role="tablist">
      <button type="button" class="tab on" id="tabLogin" role="tab">로그인</button>
      <button type="button" class="tab" id="tabSignup" role="tab">회원가입</button>
    </div>
    <form id="form" autocomplete="on" novalidate>
      <div class="field">
        <label for="username">아이디</label>
        <input type="text" id="username" name="username" maxlength="20" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="예) sandwich_lover">
        <span class="hint" id="userHint" hidden>영문 소문자·숫자·밑줄(_) 4~20자. 이메일이나 이름은 쓰지 마세요.</span>
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <div class="pw">
          <input type="password" id="password" name="password" maxlength="72" autocomplete="current-password" placeholder="비밀번호">
          <button type="button" class="eye" id="eye" aria-label="비밀번호 보기">보기</button>
        </div>
        <span class="hint" id="pwHint" hidden>6자 이상으로 만들어 주세요.</span>
      </div>
      <div class="field" id="pw2Field" hidden>
        <label for="password2">비밀번호 확인</label>
        <input type="password" id="password2" maxlength="72" autocomplete="new-password" placeholder="비밀번호를 한 번 더">
      </div>
      <button type="submit" class="btn" id="submitBtn">로그인</button>
      <p class="msg" id="msg" role="alert"></p>
    </form>
  </div>

  <!-- 로그인 후 -->
  <div class="card me" id="meCard" hidden>
    <span class="big">🥪</span>
    <h2 id="meName"></h2>
    <p>로그인 중이에요. 저장한 조합은 이 아이디로 모여요.</p>
    <button type="button" class="btn" id="goBtn">📒 내 조합 보기</button>
    <button type="button" class="btn secondary" id="logoutBtn">로그아웃</button>
    <p class="msg ok" id="meMsg"></p>
  </div>

  <div class="privacy">
    <b>🔒 개인정보는 받지 않아요</b>
    <ul>
      <li>이메일, 전화번호, 이름은 묻지 않아요. 아이디와 비밀번호만 있으면 돼요.</li>
      <li>비밀번호는 암호화해서 저장해요.</li>
      <li>비밀번호를 잊으면 되찾을 수 없어요. 꼭 기억해 두세요.</li>
    </ul>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://sbfvdczkisxdpjblqohs.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_A1f4A6YZIYxED4qC-rxbvg_vr3hhN5C'; // 공개용(publishable) 키

  const ERR = {
    bad_username: '아이디는 영문 소문자·숫자·밑줄(_) 4~20자로 만들어 주세요.',
    bad_password: '비밀번호는 6자 이상으로 만들어 주세요.',
    taken: '이미 있는 아이디예요. 다른 아이디를 써 주세요.',
    invalid: '아이디 또는 비밀번호가 맞지 않아요.',
    locked: '비밀번호를 5번 틀려서 5분 동안 잠겼어요. 잠시 뒤에 다시 시도해 주세요.',
  };
  const ID_RE = /^[a-z0-9_]{4,20}$/;
  const $ = id => document.getElementById(id);

  // ----- 로그인 정보 (아이디와 사용자 번호만 이 브라우저에 보관) -----
  function getAuth() {
    try {
      const a = JSON.parse(localStorage.getItem('sw_auth'));
      return a && a.user_id && a.username && a.token ? a : null;
    } catch (e) { return null; }
  }
  function setAuth(a) { try { localStorage.setItem('sw_auth', JSON.stringify(a)); } catch (e) {} }
  function clearAuth() { try { localStorage.removeItem('sw_auth'); } catch (e) {} }
  function refreshShell() { try { window.parent.refreshNav && window.parent.refreshNav(); } catch (e) {} }

  async function rpc(fn, args) {
    const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
      method: 'POST',
      headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(args),
    });
    if (!res.ok) throw new Error('서버에 연결하지 못했어요. 잠시 뒤에 다시 시도해 주세요.');
    return res.json();
  }


  function goTo(hash) {
    try { window.parent.location.hash = hash; } catch (e) { location.href = 'index.html#' + hash; }
  }

  // ----- 화면 -----
  let mode = 'login';
  function setMode(m) {
    mode = m;
    const signup = m === 'signup';
    $('tabLogin').classList.toggle('on', !signup);
    $('tabSignup').classList.toggle('on', signup);
    $('pw2Field').hidden = !signup;
    $('userHint').hidden = !signup;
    $('pwHint').hidden = !signup;
    $('password').autocomplete = signup ? 'new-password' : 'current-password';
    $('submitBtn').textContent = signup ? '가입하고 시작하기' : '로그인';
    $('msg').textContent = '';
  }
  function render() {
    const a = getAuth();
    $('formCard').hidden = !!a;
    $('meCard').hidden = !a;
    if (a) $('meName').textContent = a.username + ' 님' + (a.is_admin ? ' · 👑 관리자' : '');
  }

  $('tabLogin').addEventListener('click', () => setMode('login'));
  $('tabSignup').addEventListener('click', () => setMode('signup'));
  $('eye').addEventListener('click', () => {
    const show = $('password').type === 'password';
    $('password').type = show ? 'text' : 'password';
    $('password2').type = show ? 'text' : 'password';
    $('eye').textContent = show ? '숨기기' : '보기';
  });
  $('username').addEventListener('input', e => { e.target.value = e.target.value.toLowerCase().replace(/\s/g, ''); });

  function msg(text, ok) { const m = $('msg'); m.textContent = text || ''; m.className = 'msg' + (ok ? ' ok' : ''); }

  $('form').addEventListener('submit', async e => {
    e.preventDefault();
    const username = $('username').value.trim().toLowerCase();
    const password = $('password').value;
    if (!ID_RE.test(username)) { msg(ERR.bad_username); return; }
    if (mode === 'signup') {
      if (password.length < 6) { msg(ERR.bad_password); return; }
      if (password !== $('password2').value) { msg('비밀번호가 서로 달라요. 다시 확인해 주세요.'); return; }
    } else if (!password) { msg('비밀번호를 입력해 주세요.'); return; }

    $('submitBtn').disabled = true;
    msg(mode === 'signup' ? '계정을 만드는 중…' : '로그인하는 중…', true);
    try {
      const r = await rpc(mode === 'signup' ? 'signup_user' : 'login_user', { p_username: username, p_password: password });
      if (r.error) { msg(ERR[r.error] || '문제가 생겼어요. 다시 시도해 주세요.'); return; }
      setAuth({ user_id: r.user_id, username: r.username, token: r.token, is_admin: !!r.is_admin });
      $('password').value = ''; $('password2').value = '';
      msg('');
      render();
      refreshShell();
      $('meMsg').textContent = mode === 'signup' ? '가입했어요 ✓' : '로그인했어요 ✓';
    } catch (err) {
      msg(err.message);
    } finally {
      $('submitBtn').disabled = false;
    }
  });

  $('goBtn').addEventListener('click', () => goTo('myrecipes'));
  $('logoutBtn').addEventListener('click', () => {
    const a = getAuth();
    if (a) rpc('logout_user', { p_token: a.token }).catch(() => {}); // 서버의 로그인 정보도 지웁니다
    clearAuth();
    $('meMsg').textContent = '';
    setMode('login');
    render();
    refreshShell();
  });

  setMode('login');
  render();
</script>
</body>
</html>
