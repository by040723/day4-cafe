<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sandwhich? | 샌드위치, 뭐 먹지?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  /* Wise 디자인 토큰 (DESIGN-wise.md) */
  :root {
    --primary: #b8d98b;
    --primary-active: #d4e8ad;
    --primary-pale: #eef6dc;
    --bg: #fcf9f2;
    --card-bg: #f0ebe1;
    --hover: #d4e8ad;
    --on-primary: #1f1510;
    --ink: #1f1510;
    --body: #454745;
    --mute: #868685;
    --canvas: #ffffff;
    --canvas-soft: #e8ebe6;
    --positive-deep: #054d28;
    --warning: #ffd11a;
    --r-sm: 8px;
    --r-md: 12px;
    --r-xl: 24px;
    --r-pill: 9999px;
    --menu-w: 240px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: Inter, 'Noto Sans KR', system-ui, -apple-system, sans-serif;
    font-feature-settings: "calt";
    font-size: 16px; line-height: 24px;
    background: var(--bg);
    color: var(--ink);
    display: flex;
  }
  .display { font-weight: 900; letter-spacing: 0; }
  /* 이모지를 아주 살짝 웜톤으로 */
  .emoji, .big { filter: sepia(.3) saturate(1.1); }

  /* ---------- 왼쪽 메뉴 (nav-bar) ---------- */
  .sidebar {
    width: var(--menu-w);
    flex-shrink: 0;
    background: #f7f2e7;
    color: var(--ink);
    display: flex; flex-direction: column;
    padding: 24px 16px;
    gap: 4px;
    border-right: 1px solid var(--card-bg);
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    padding: 4px 12px 24px;
    font-size: 24px; line-height: 26px; font-weight: 900;
  }
  .brand svg { flex-shrink: 0; }
  .brand-text { display: flex; flex-direction: column; justify-content: center; gap: 1px; height: 40px; }
  .brand-text b { font-size: 22px; line-height: 25px; font-weight: 900; }
  .brand-text small { font-size: 12px; line-height: 14px; font-weight: 600; color: #9a9088; }
  #nav { display: flex; flex-direction: column; gap: 4px; }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    width: 100%;
    padding: 12px 16px;
    border: none; border-radius: var(--r-sm);
    background: transparent; color: var(--ink);
    font: inherit; font-size: 14px; font-weight: 600; line-height: 20px; text-align: left;
    cursor: pointer;
    transition: background .15s;
  }
  .nav-item:hover { background: #ece5d6; }
  .nav-item.active { background: var(--primary); }
  .nav-item .emoji { font-size: 20px; }
  .sidebar-foot { margin-top: auto; padding: 12px 16px 0; font-size: 12px; line-height: 16px; color: var(--mute); }

  /* ---------- 가운데 화면 ---------- */
  .stage { flex: 1; min-width: 0; height: 100vh; position: relative; overflow: auto; }
  .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: var(--bg); }
  .view { padding: 32px; max-width: 1100px; margin: 0 auto; }

  /* 홈: hero-band-dark */
  .hero {
    background: #f7efd2;
    color: var(--ink);
    border-radius: var(--r-xl);
    padding: 48px;
    display: flex; align-items: center; justify-content: space-between; gap: 32px;
  }
  .hero h1 { font-size: 56px; line-height: 1.1; font-weight: 900; margin-bottom: 16px; }
  .hero p { font-size: 20px; line-height: 30px; color: var(--body); max-width: 460px; }
  .hero svg { flex-shrink: 0; }
  .btn {
    display: inline-block; margin-top: 24px;
    padding: 12px 24px; border: none; border-radius: var(--r-xl);
    background: var(--primary); color: var(--on-primary);
    font: inherit; font-size: 16px; font-weight: 600; line-height: 24px;
    cursor: pointer; transition: background .15s;
  }
  .btn:hover { background: var(--hover); }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; margin-top: 16px; }
  .card {
    position: relative;
    background: var(--card-bg);
    border: none; border-radius: var(--r-xl);
    padding: 24px;
    text-align: left; font: inherit; color: var(--ink);
    cursor: pointer;
    transition: background .15s;
  }
  .card .star { position: absolute; top: 16px; right: 16px; }
  .card:nth-child(2) { background: var(--primary-pale); }
  .card:hover { background: #f7efd2; }
  .card .big { font-size: 40px; line-height: 48px; display: block; margin-bottom: 12px; }
  .card h3 { font-size: 24px; line-height: 31px; font-weight: 600; letter-spacing: -0.48px; margin-bottom: 4px; }
  .card p { font-size: 14px; line-height: 20px; color: var(--body); }
  .badge {
    display: inline-block; margin-top: 12px;
    padding: 4px 12px; border-radius: var(--r-pill);
    background: var(--primary-pale); color: var(--positive-deep);
    font-size: 14px; font-weight: 600; line-height: 20px;
  }
  .card:nth-child(2) .badge { background: var(--canvas); }

  /* 준비중 (empty-state) */
  .soon { min-height: calc(100vh - 64px); display: flex; align-items: center; justify-content: center; }
  .soon-card {
    background: var(--card-bg); border-radius: var(--r-xl);
    padding: 48px; text-align: center; max-width: 420px; width: 100%;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  .soon-card .big { font-size: 64px; line-height: 72px; }
  .soon-card h2 { font-size: 40px; line-height: 44px; font-weight: 900; }
  .soon-card p { color: var(--body); }

  /* ---------- 모바일 ---------- */
  @media (max-width: 767px) {
    body { flex-direction: column; }
    .sidebar { width: 100%; flex-direction: row; align-items: center; padding: 8px 12px; overflow-x: auto; }
    .brand, .sidebar-foot { display: none; }
    #nav { flex-direction: row; }
    .nav-item { width: auto; flex-shrink: 0; padding: 8px 12px; flex-direction: column; gap: 0; font-size: 12px; line-height: 16px; }
    .stage { height: auto; flex: 1; min-height: 0; }
    .view { padding: 16px; }
    .hero { flex-direction: column; text-align: center; padding: 32px 24px; }
    .hero h1 { font-size: 40px; }
    .hero p { font-size: 16px; line-height: 24px; }
    .soon { min-height: 60vh; }
  }
</style>
</head>
<body>

<nav class="sidebar" aria-label="메인 메뉴">
  <div class="brand">
    <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">
      <path d="M2 8 v-2 a6 6 0 0 1 6 -6 h24 a6 6 0 0 1 6 6 v2z" fill="#e8b46a"/>
      <rect x="4" y="11" width="32" height="4" rx="2" fill="#7bd65a"/>
      <rect x="4" y="18" width="32" height="4" rx="2" fill="#ffc600"/>
      <rect x="4" y="25" width="32" height="4" rx="2" fill="#e0453a"/>
      <rect x="2" y="32" width="36" height="8" rx="4" fill="#e8b46a"/>
    </svg>
    <span class="brand-text"><b>Sandwhich?</b><small>샌드위치, 뭐 먹지?</small></span>
  </div>
  <div id="nav"></div>
  <div class="sidebar-foot">🥪 나만의 조합을 저장해요</div>
</nav>

<main class="stage" id="stage">
  <div class="view" id="view"></div>
</main>

<script>
  // 페이지가 완성되면 ready: true 로 바꾸면 가운데 화면에 해당 HTML 파일이 열립니다.
  // 로그인 카드 포인트: 패티색 별(*)
  const STAR = '<svg class="star" width="18" height="18" viewBox="0 0 28 28" aria-hidden="true"><g stroke="#e0453a" stroke-width="5" stroke-linecap="round"><path d="M14 3 V25"/><path d="M4.5 8.5 L23.5 19.5"/><path d="M23.5 8.5 L4.5 19.5"/></g></svg>';
  const PAGES = [
    { id: 'home',      file: 'index.html',     emoji: '🏠', label: '홈',          desc: '사이트 소개',                       ready: true  },
    { id: 'recommend', file: 'recommend.html', emoji: '✨', label: '추천 조합',    desc: 'AI 추천과 다른 사람들의 조합',      ready: false },
    { id: 'menu',      file: 'menu.html',      emoji: '🥖', label: '조합 만들기',  desc: '빵을 깔고 재료를 쌓아 보세요',      ready: false },
    { id: 'myrecipes', file: 'myrecipes.html', emoji: '📒', label: '내 조합',      desc: '저장한 조합 보기·수정·삭제',        ready: false },
    { id: 'login',     file: 'login.html',     emoji: '🔑', label: '로그인',       desc: '로그인 · 회원가입',                 ready: false },
  ];

  const nav = document.getElementById('nav');
  const stage = document.getElementById('stage');
  const view = document.getElementById('view');
  let frame = null;

  PAGES.forEach(p => {
    const b = document.createElement('button');
    b.className = 'nav-item';
    b.dataset.id = p.id;
    b.innerHTML = '<span class="emoji">' + p.emoji + '</span><span>' + p.label + '</span>';
    b.addEventListener('click', () => { location.hash = p.id; });
    nav.appendChild(b);
  });

  function renderHome() {
    const cards = PAGES.filter(p => p.id !== 'home').map(p =>
      '<button class="card" data-go="' + p.id + '">' +
        '<span class="big">' + p.emoji + '</span>' +
        '<h3>' + p.label + '</h3><p>' + p.desc + '</p>' +
        (p.ready ? '' : '<span class="badge">준비중</span>') +
        (p.id === 'login' ? STAR : '') +
      '</button>'
    ).join('');
    view.innerHTML =
      '<section class="hero">' +
        '<div><h1 class="display">나만의 샌드위치,<br>만들고 저장해요</h1>' +
        '<p>빵, 치즈, 야채, 소스를 골라 샌드위치를 쌓아 보세요. 마음에 드는 조합은 저장해 두고 주문 전에 다시 꺼내 보면 돼요.</p>' +
        '<button class="btn" data-go="menu">🥖 조합 만들기</button></div>' +
        // 모든 층 사이 간격 8로 통일 (윤곽선 바깥 기준)
        '<svg width="190" height="175" viewBox="0 0 150 138" aria-hidden="true">' +
          '<path d="M12 36 h126 v-8 q0 -18 -24 -18 h-78 q-24 0 -24 18z" fill="#e8b46a" stroke="#2e2018" stroke-width="4" stroke-linejoin="round"/>' +
          '<circle cx="45" cy="22" r="3" fill="#fff3d0"/><circle cx="75" cy="20" r="3" fill="#fff3d0"/><circle cx="105" cy="22" r="3" fill="#fff3d0"/>' +
          '<path d="M14 46 q15 14 30 0 q15 14 30 0 q15 14 30 0 q15 14 32 0 v8 h-122z" fill="#7bd65a" stroke="#2e2018" stroke-width="4" stroke-linejoin="round"/>' +
          '<rect x="14" y="64" width="122" height="10" rx="3" fill="#ffc600" stroke="#2e2018" stroke-width="4"/>' +
          '<rect x="14" y="84" width="122" height="10" rx="5" fill="#e0453a" stroke="#2e2018" stroke-width="4"/>' +
          '<path d="M12 104 h126 v8 q0 18 -24 18 h-78 q-24 0 -24 -18z" fill="#e8b46a" stroke="#2e2018" stroke-width="4" stroke-linejoin="round"/>' +
        '</svg>' +
      '</section>' +
      '<section class="cards">' + cards + '</section>';
    view.querySelectorAll('[data-go]').forEach(el =>
      el.addEventListener('click', () => { location.hash = el.dataset.go; }));
  }

  function renderSoon(p) {
    view.innerHTML =
      '<div class="soon"><div class="soon-card"><span class="big">' + p.emoji + '</span>' +
      '<h2 class="display">' + p.label + '</h2>' +
      '<span class="badge">🚧 준비중</span>' +
      '<p>이 페이지는 아직 만들고 있어요.<br>조금만 기다려 주세요!</p></div></div>';
  }

  function show(id) {
    const p = PAGES.find(x => x.id === id) || PAGES[0];
    nav.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.id === p.id));
    document.title = p.label + ' | Sandwhich?';

    if (frame) frame.style.display = 'none';
    view.style.display = 'block';

    if (p.id === 'home') return renderHome();
    if (!p.ready) return renderSoon(p);

    // 완성된 페이지는 가운데 영역에 그대로 불러옵니다.
    view.style.display = 'none';
    if (!frame) {
      frame = document.createElement('iframe');
      frame.title = '내용';
      stage.appendChild(frame);
    }
    frame.style.display = 'block';
    if (frame.dataset.file !== p.file) { frame.src = p.file; frame.dataset.file = p.file; }
  }

  window.addEventListener('hashchange', () => show(location.hash.slice(1)));
  show(location.hash.slice(1));
</script>
</body>
</html>
